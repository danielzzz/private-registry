# Demo stack: auth on 18080, registry on 5000 (avoids common 8080 clashes).
# Prefer ./demo.sh rather than invoking this file directly.

services:
  auth:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      HTTP_ADDR: :8080
      DATABASE_PATH: ${DATABASE_PATH:-/data/registry-auth.db}
      REGISTRY_SERVICE: ${REGISTRY_SERVICE:-registry}
      TOKEN_ISSUER: ${TOKEN_ISSUER:-registry-auth}
      TOKEN_CERT_PATH: ${TOKEN_CERT_PATH:-/certs/token.crt}
      TOKEN_KEY_PATH: ${TOKEN_KEY_PATH:-/certs/token.key}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
    ports:
      - "18080:8080"
    volumes:
      - auth-data:/data
      - certs:/certs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
      - registry-data:/var/lib/registry
      - certs:/certs:ro
    depends_on:
      auth:
        condition: service_healthy

volumes:
  auth-data:
  certs:
  registry-data:
