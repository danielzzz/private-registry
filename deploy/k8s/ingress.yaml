apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: private-registry
  namespace: private-registry
spec:
  rules:
    # Replace placeholder hosts with your domain before applying.
    - host: registry.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8080
