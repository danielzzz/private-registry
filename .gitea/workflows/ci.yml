name: Test and publish image

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Set secrets.REGISTRY_URL (and login secrets) on the Gitea runner for image publish.
  IMAGE_NAME: private-registry/auth
  GOMODCACHE: /var/cache/private-registry/gomod
  GOCACHE: /var/cache/private-registry/gocache

jobs:
  test:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
      options: -v /var/cache/private-registry:/var/cache/private-registry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          go test ./...

  build:
    needs: test
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set registry
        run: |
          if [ -z "$REGISTRY_URL" ]; then
            echo "REGISTRY_URL secret is required to publish" >&2
            exit 1
          fi
          echo "REGISTRY=$REGISTRY_URL" >> $GITHUB_ENV
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set image tag
        id: tag
        run: echo "tag=main-$(date +%s)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          no-cache: true
          provenance: false
          sbom: false
